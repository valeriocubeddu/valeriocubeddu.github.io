<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 1800 775" width="1800" height="775">

<defs>
<style>
text{font-family:'Times New Roman',Times,serif;fill:#1a1a1a}
.it{font-style:italic}.bf{font-weight:bold}
.pur{fill:#8E3B6A}.grn{fill:#00704F}.gry{fill:#555}
</style>
<marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1a1a1a"/></marker>
<marker id="ahp" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5.5" markerHeight="5.5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#A8497E"/></marker>
<symbol id="lock" viewBox="0 0 20 24"><path d="M5,11 V7.5 A5,5 0 0 1 15,7.5 V11" fill="none" stroke="#0072B2" stroke-width="2.4"/><rect x="2.5" y="10.5" width="15" height="12" rx="2.2" fill="#0072B2"/><circle cx="10" cy="15.8" r="1.9" fill="#fff"/></symbol>
<symbol id="wheelslip" viewBox="0 0 48 44"><path d="M9,9 A17,17 0 0 1 39,9" fill="none" stroke="#A8497E" stroke-width="2.6"/><polygon points="41,4 42,13 34,10" fill="#A8497E"/><circle cx="24" cy="24" r="14" fill="#1a1a1a"/><circle cx="24" cy="24" r="6" fill="#c4c4c4"/><line x1="2" y1="40" x2="46" y2="40" stroke="#555" stroke-width="2.4"/><line x1="5" y1="43" x2="19" y2="43" stroke="#A8497E" stroke-width="2" stroke-dasharray="3 2"/></symbol>
<symbol id="accel" viewBox="0 0 60 24"><polyline points="0,13 10,13 14,4 18,21 22,7 26,16 31,11 36,13.5 60,12.5" fill="none" stroke="#A8497E" stroke-width="2.4" stroke-linejoin="round"/></symbol>
<symbol id="cell" viewBox="0 0 320 86"><g stroke="#00704F" stroke-width="2.65" fill="none"><rect x="52" y="6" width="216" height="74" rx="10" fill="#fff"/><line x1="28" y1="26" x2="296" y2="26"/><line x1="28" y1="62" x2="296" y2="62"/><circle cx="100" cy="26" r="8" fill="#fff"/><line x1="96" y1="22" x2="104" y2="30"/><line x1="96" y1="30" x2="104" y2="22"/><circle cx="165" cy="26" r="8" fill="#fff"/><line x1="160.5" y1="26" x2="169.5" y2="26"/><line x1="165" y1="21.5" x2="165" y2="30.5"/><circle cx="240" cy="62" r="8" fill="#fff"/><line x1="236" y1="58" x2="244" y2="66"/><line x1="236" y1="66" x2="244" y2="58"/><rect x="88" y="38" width="24" height="18" fill="#fff"/><line x1="100" y1="62" x2="100" y2="56"/><line x1="100" y1="38" x2="100" y2="34"/><rect x="147" y="38" width="36" height="18" fill="#fff"/><line x1="165" y1="62" x2="165" y2="56"/><line x1="165" y1="38" x2="165" y2="34"/><line x1="240" y1="34" x2="240" y2="54"/><line x1="70" y1="86" x2="70" y2="62"/></g><text x="100" y="52" font-size="17" text-anchor="middle" class="it" style="fill:#00704F">σ</text><text x="165" y="52" font-size="13" text-anchor="middle" class="it" style="fill:#00704F">tanh</text><text x="14" y="32" font-size="21" text-anchor="middle" class="it" style="fill:#00704F">c</text><text x="14" y="68" font-size="21" text-anchor="middle" class="it" style="fill:#00704F">h</text></symbol>
<!-- icona dell'auto della Fig. 2: Icons_Car di Office, copiata verbatim da ppt/media/image1.svg -->
<symbol id="carFig2" viewBox="0 0 96 96"><circle cx="24" cy="62" r="8"/><circle cx="72" cy="62" r="8"/><path d="M39 42 39 30 52.7 30C53.8 30 54.8 30.4 55.5 31.2L66.3 42 39 42ZM35 42 9.7 42 20.5 31.2C21.3 30.4 22.3 30 23.3 30L35 30 35 42ZM82 42 73.7 42C72.6 42 71.6 41.6 70.9 40.8L58.3 28.3C56.8 26.8 54.8 26 52.6 26L23.3 26C21.2 26 19.1 26.8 17.6 28.3L5.2 40.8C4.4 41.6 4 42.6 4 43.7L4 54C4 58.4 7.6 62 12 62L13 62C13 55.9 17.9 51 24 51 30.1 51 35 55.9 35 62L61 62C61 55.9 65.9 51 72 51 78.1 51 83 55.9 83 62L88 62C90.2 62 92 60.2 92 58L92 52C92 46.5 87.5 42 82 42Z"/></symbol>
</defs>

<rect width="1800" height="775" fill="#ffffff"/>

<!-- ============ flusso diretto ============ -->
<text x="40" y="236" font-size="32"><tspan class="it bf">s</tspan>(<tspan class="it">t</tspan>)</text>
<text x="52" y="272" font-size="22" class="gry">[337]</text>
<line x1="118" y1="246" x2="176" y2="246" stroke="#1a1a1a" stroke-width="3" marker-end="url(#ah)"/>

<!-- callout della cella -->
<rect x="150" y="20" width="400" height="112" rx="14" fill="#fff" stroke="#009E73" stroke-width="2" stroke-dasharray="7 5"/>
<use href="#cell" x="176" y="32" width="350" height="94"/>
<text x="566" y="80" font-size="23" class="it grn">inside each layer:</text>
<text x="566" y="108" font-size="23" class="it grn">cell state <tspan class="bf">c</tspan>, hidden state <tspan class="bf">h</tspan></text>
<line x1="232" y1="132" x2="204" y2="151" stroke="#9a9a9a" stroke-width="1.8"/>
<line x1="470" y1="132" x2="504" y2="151" stroke="#9a9a9a" stroke-width="1.8"/>

<!-- pila LSTM (pesi congelati); testi centrati sul riquadro frontale (180-480) -->
<rect x="204" y="151" width="300" height="150" rx="10" fill="#EAF6F1" stroke="#009E73" stroke-width="2.5"/>
<rect x="196" y="159" width="300" height="150" rx="10" fill="#E3F3EC" stroke="#009E73" stroke-width="2.5"/>
<rect x="188" y="167" width="300" height="150" rx="10" fill="#DDF1EA" stroke="#009E73" stroke-width="2.5"/>
<rect x="180" y="175" width="300" height="150" rx="10" fill="#D6EEE5" stroke="#009E73" stroke-width="3"/>
<use href="#lock" x="436" y="184" width="30" height="36"/>
<text x="330" y="266" font-size="36" text-anchor="middle" class="bf grn">LSTM</text>
<text x="330" y="302" font-size="23" text-anchor="middle" class="grn">4 layers · 64 units</text>
<path d="M180,342 v10 h324 v-10" fill="none" stroke="#00704F" stroke-width="2"/>
<text x="342" y="384" font-size="24" text-anchor="middle" class="it grn">trained offline</text>
<text x="342" y="414" font-size="24" text-anchor="middle" class="it grn">by imitating the NMPC</text>

<!-- h4: freccia unica dalla LSTM al layer di uscita (simbolo del vettore tolto il 2026-09-15) -->
<line x1="508" y1="250" x2="760" y2="250" stroke="#1a1a1a" stroke-width="3" marker-end="url(#ah)"/>
<text x="634" y="232" font-size="30" text-anchor="middle"><tspan class="it bf">h</tspan><tspan dy="7" font-size="20">4</tspan><tspan dy="-7">(</tspan><tspan class="it">t</tspan>)</text>

<!-- layer di uscita adattivo (centro x = 965) -->
<rect x="765" y="155" width="400" height="180" rx="14" fill="#ffffff" stroke="#1a1a1a" stroke-width="2.8"/>
<text x="965" y="212" font-size="27" text-anchor="middle" class="bf">adaptive output layer</text>
<text x="965" y="286" font-size="31" text-anchor="middle">Δ<tspan class="it">T</tspan><tspan dy="8" font-size="21" class="it">m,ij</tspan><tspan dy="-8"> = </tspan><tspan class="it bf">W</tspan><tspan dy="8" font-size="21" class="it">out,ij</tspan><tspan dy="-8"> </tspan><tspan class="it bf">h</tspan><tspan dy="8" font-size="21">4</tspan><tspan dy="-8"> + </tspan><tspan class="it">b</tspan><tspan dy="8" font-size="21" class="it">out,ij</tspan></text>

<!-- uscita -->
<line x1="1168" y1="246" x2="1364" y2="246" stroke="#1a1a1a" stroke-width="3" marker-end="url(#ah)"/>
<text x="1266" y="228" font-size="30" text-anchor="middle">Δ<tspan class="it">T</tspan><tspan dy="8" font-size="21" class="it">m,ij</tspan></text>

<!-- plant: stesso blocco della Fig. 2, scala 0.8 (80 px per cm di slide); testi e icona sul centro (192.85) -->
<g transform="translate(1370,93)">
  <rect x="0" y="0" width="385.7" height="307.0" fill="#ffffff" stroke="#1a1a1a" stroke-width="2.8"/>
  <text x="192.85" y="57" font-size="31" text-anchor="middle" class="bf">Plant model</text>
  <text x="192.85" y="115" font-size="31" text-anchor="middle">Vehicle with four in-wheel</text>
  <text x="192.85" y="152.5" font-size="31" text-anchor="middle">motors model</text>
  <use href="#carFig2" x="91.25" y="125.3" width="203.2" height="203.2" fill="#000000"/>
</g>

<!-- ============ loop di adattamento ============ -->
<path d="M1563,402 V494" fill="none" stroke="#A8497E" stroke-width="3.5" marker-end="url(#ahp)"/>
<text x="1580" y="458" font-size="28"><tspan class="it">ẍ</tspan><tspan dy="7" font-size="20" class="it">b</tspan><tspan dy="-7">, </tspan><tspan class="it">σ</tspan><tspan dy="7" font-size="20" class="it">ij</tspan></text>

<!-- blocco: errori (centro x = 1490). Gruppo centrato: icone in colonna, formule con "=" allineati -->
<rect x="1220" y="500" width="540" height="250" rx="16" fill="#ffffff" stroke="#1a1a1a" stroke-width="2.8"/>
<text x="1490" y="546" font-size="29" text-anchor="middle" class="bf">measure the errors</text>
<use href="#accel" x="1342" y="593" width="90" height="36"/>
<text x="1492" y="623" font-size="30" text-anchor="end"><tspan class="it">e</tspan><tspan dy="7" font-size="21" class="it">a</tspan></text>
<text x="1502" y="623" font-size="30"><tspan>= </tspan><tspan class="it">ẍ</tspan><tspan dy="7" font-size="21" class="it">b</tspan><tspan dy="-7"> − </tspan><tspan class="it">ẍ</tspan><tspan dy="7" font-size="21" class="it">b,ref</tspan></text>
<use href="#wheelslip" x="1356" y="647" width="62" height="57"/>
<text x="1492" y="693" font-size="30" text-anchor="end"><tspan class="it">e</tspan><tspan dy="7" font-size="21" class="it">σ,ij</tspan></text>
<text x="1502" y="693" font-size="30"><tspan>= </tspan><tspan class="it">σ</tspan><tspan dy="7" font-size="21" class="it">ij</tspan><tspan dy="-7"> − </tspan><tspan class="it">σ</tspan><tspan dy="7" font-size="21" class="it">ref,ij</tspan></text>

<line x1="1218" y1="625" x2="1186" y2="625" stroke="#A8497E" stroke-width="3.5" marker-end="url(#ahp)"/>

<!-- blocco: KPI e loss (centro x = 915) -->
<rect x="650" y="500" width="530" height="250" rx="16" fill="#ffffff" stroke="#1a1a1a" stroke-width="2.8"/>
<text x="915" y="546" font-size="29" text-anchor="middle" class="bf">score the vehicle KPIs</text>
<text x="915" y="655" font-size="32" text-anchor="middle"><tspan class="it">J</tspan><tspan> = </tspan><tspan style="font-size:68px" dy="13">Σ</tspan><tspan dy="16" font-size="21" class="it">k</tspan><tspan dy="-29"> </tspan><tspan class="it">w</tspan><tspan dy="8" font-size="21" class="it">k</tspan><tspan dy="-8"> · </tspan><tspan class="it">KPI</tspan><tspan dy="8" font-size="21" class="it">k</tspan></text>

<line x1="648" y1="625" x2="616" y2="625" stroke="#A8497E" stroke-width="3.5" marker-end="url(#ahp)"/>

<!-- blocco: aggiornamento (centro x = 325); ogni riga centrata -->
<rect x="40" y="500" width="570" height="250" rx="16" fill="#ffffff" stroke="#1a1a1a" stroke-width="2.8"/>
<text x="325" y="546" font-size="29" text-anchor="middle" class="bf">nudge the output layer</text>
<text x="325" y="648" font-size="30" text-anchor="middle"><tspan class="it bf">W</tspan><tspan dy="8" font-size="20" class="it">out,ij</tspan><tspan dy="-8">(</tspan><tspan class="it">t</tspan><tspan>+1) = </tspan><tspan class="it bf">W</tspan><tspan dy="8" font-size="20" class="it">out,ij</tspan><tspan dy="-8">(</tspan><tspan class="it">t</tspan><tspan>) − </tspan><tspan class="it">η</tspan><tspan dy="8" font-size="20" class="it">ij</tspan><tspan dy="-8"> </tspan><tspan class="it">δ</tspan><tspan dy="8" font-size="20" class="it">ij</tspan><tspan dy="-8"> </tspan><tspan class="it bf">h</tspan><tspan dy="8" font-size="20">4</tspan><tspan dy="-20" font-size="20">T</tspan><tspan dy="12">(</tspan><tspan class="it">t</tspan><tspan>)</tspan></text>

<!-- ritorno al layer di uscita: porta i parametri aggiornati, usati al passo successivo -->
<path d="M325,498 V460 H965 V342" fill="none" stroke="#A8497E" stroke-width="4.5" marker-end="url(#ahp)"/>
<text x="645" y="440" font-size="28" text-anchor="middle"><tspan class="it bf">W</tspan><tspan dy="7" font-size="20" class="it">out,ij</tspan><tspan dy="-7">(</tspan><tspan class="it">t</tspan><tspan>+1)</tspan></text>
</svg>
