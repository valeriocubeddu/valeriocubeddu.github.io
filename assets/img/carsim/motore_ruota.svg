<text x="270" y="524.0" font-size="19.2" text-anchor="middle" font-weight="600" fill="#1f2d3d">−</text>
<line x1="284" y1="519.0" x2="320" y2="519.0" stroke="#30455e" stroke-width="1.6" marker-end="url(#a)"/>
<rect x="320" y="480" width="200" height="78" rx="10" fill="#d3e4f3" stroke="#30455e" stroke-width="1.4"/><text x="420.0" y="515.5" font-size="15.6" text-anchor="middle" font-weight="400" fill="#1f2d3d">Controllo di velocità PI</text>
<text x="420.0" y="535.0" font-size="15.6" text-anchor="middle" font-weight="400" fill="#1f2d3d">+ stima coppia di carico</text>
<line x1="520" y1="519.0" x2="560" y2="519.0" stroke="#30455e" stroke-width="1.6" marker-end="url(#a)"/>
<text x="540" y="511.0" font-size="15.6" text-anchor="middle" font-weight="600" fill="#1f2d3d" font-style="italic">T*</text>
