<rect x="822" y="64" width="262" height="312" rx="12" fill="#f7f9fb" stroke="#c4cdd6" stroke-width="1.2"/>
<text x="838" y="92.0" font-size="18.0" text-anchor="start" font-weight="600" fill="#1f2d3d">Le equazioni</text>
<text x="838" y="124.0" font-size="14.4" text-anchor="start" font-weight="400" fill="#5b6b7b">rotore e ruota:</text>
<text x="838" y="144.0" font-size="16.8" text-anchor="start" font-weight="600" fill="#1f2d3d" font-style="italic">J ω̇ = T<tspan baseline-shift="sub" font-size="75%">m</tspan> − T<tspan baseline-shift="sub" font-size="75%">L</tspan></text>
<text x="838" y="186.0" font-size="14.4" text-anchor="start" font-weight="400" fill="#5b6b7b">coppia del motore (FOC):</text>
<text x="838" y="206.0" font-size="16.8" text-anchor="start" font-weight="600" fill="#1f2d3d" font-style="italic">T<tspan baseline-shift="sub" font-size="75%">m</tspan> = (3p M / 2L<tspan baseline-shift="sub" font-size="75%">r</tspan>) ψ i<tspan baseline-shift="sub" font-size="75%">q</tspan></text>
<text x="838" y="248.0" font-size="14.4" text-anchor="start" font-weight="400" fill="#5b6b7b">slip della ruota:</text>
<text x="838" y="268.0" font-size="16.8" text-anchor="start" font-weight="600" fill="#1f2d3d" font-style="italic">λ = (ω<tspan baseline-shift="sub" font-size="75%">w</tspan> R<tspan baseline-shift="sub" font-size="75%">ω</tspan> − v<tspan baseline-shift="sub" font-size="75%">x</tspan>) / v<tspan baseline-shift="sub" font-size="75%">x</tspan></text>
<text x="838" y="310.0" font-size="14.4" text-anchor="start" font-weight="400" fill="#5b6b7b">legge di controllo:</text>
<text x="838" y="330.0" font-size="16.8" text-anchor="start" font-weight="600" fill="#1f2d3d" font-style="italic">T* = T̂<tspan baseline-shift="sub" font-size="75%">L</tspan> − J (k<tspan baseline-shift="sub" font-size="75%">p</tspan> ω̃ + k<tspan baseline-shift="sub" font-size="75%">i</tspan> ∫ω̃)</text>
<text x="838" y="374.0" font-size="14.4" text-anchor="start" font-weight="400" fill="#5b6b7b" font-style="italic">ω̃ = ω − ω*</text>
<text x="40" y="424.0" font-size="18.0" text-anchor="start" font-weight="600" fill="#1f2d3d">Anello di controllo di ogni motore</text>
<rect x="30" y="436" width="1050" height="230" rx="14" fill="none" stroke="#c4cdd6" stroke-width="1.2" stroke-dasharray="5 4"/>
<text x="44" y="508.0" font-size="14.4" text-anchor="start" font-weight="400" fill="#30455e">riferimento di velocità ω*</text>
<text x="44" y="526.0" font-size="14.4" text-anchor="start" font-weight="400" fill="#30455e">(dal livello intermedio)</text>
