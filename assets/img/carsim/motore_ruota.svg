<text x="692" y="494.0" font-size="15.6" text-anchor="middle" font-weight="600" fill="#1f2d3d">Controllo a orientamento di campo</text>
<text x="692" y="524.0" font-size="15.6" text-anchor="middle" font-weight="400" fill="#1f2d3d" font-style="italic">i<tspan baseline-shift="sub" font-size="75%">d</tspan> → flusso di rotore ψ</text>
<text x="692" y="548.0" font-size="15.6" text-anchor="middle" font-weight="400" fill="#1f2d3d" font-style="italic">i<tspan baseline-shift="sub" font-size="75%">q</tspan> → coppia</text>
