<rect x="855" y="490" width="105" height="58" rx="10" fill="#eef0f2" stroke="#30455e" stroke-width="1.4"/><text x="907.5" y="523.5" font-size="15.6" text-anchor="middle" font-weight="400" fill="#1f2d3d">Inverter</text>
<line x1="960" y1="519.0" x2="1000" y2="519.0" stroke="#30455e" stroke-width="1.6" marker-end="url(#a)"/>
<circle cx="1035" cy="519.0" r="30" fill="#c9d6e3" stroke="#30455e" stroke-width="1.6"/>
<text x="1035" y="525.0" font-size="21.6" text-anchor="middle" font-weight="700" fill="#1f2d3d">M</text>
<text x="1035" y="479.0" font-size="14.4" text-anchor="middle" font-weight="400" fill="#5b6b7b" font-style="italic">i<tspan baseline-shift="sub" font-size="75%">abc</tspan></text>
<polyline points="1035,549.0 1035,608 270,608 270,535.0" fill="none" stroke="#8a5a2b" stroke-width="1.6" marker-end="url(#a)"/>
<text x="640" y="600.0" font-size="14.4" text-anchor="middle" font-weight="400" fill="#8a5a2b">velocità misurata ω</text>
<text x="40" y="686.0" font-size="14.4" text-anchor="start" font-weight="400" fill="#5b6b7b">Il carico T<tspan baseline-shift="sub" font-size="75%">L</tspan>, cioè la forza dello pneumatico riportata al motore, non è misurato: lo stima il controllore e lo compensa.</text>
